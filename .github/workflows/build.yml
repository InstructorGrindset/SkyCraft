name: Build test release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test the Fabric mod
        working-directory: fabric
        run: |
          chmod +x gradlew
          ./gradlew build --no-configuration-cache --stacktrace

      - name: Read the mod version
        id: ver
        run: echo "version=$(grep '^version=' fabric/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Publish the test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          name: SkyCraft ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: Test build from the dev branch, commit ${{ github.sha }}.
          files: |
            fabric/build/libs/skycraft-${{ steps.ver.outputs.version }}.jar
